name: dependabot-rewrite

# `pull_request_target` so the workflow can read GPG_PRIVATE_KEY /
# GPG_PASSPHRASE (regular `pull_request` runs without secrets on bot events).
# The workflow body is loaded from `main`, not the PR branch, so no untrusted
# code runs. The gate on the pull request author id (49699333 is
# dependabot[bot]) restricts it to genuine Dependabot PRs; unlike the actor,
# the author does not change when someone else re-runs the workflow.

on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  rewrite:
    name: rewrite dependabot commits
    if: github.event.pull_request.user.id == 49699333
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # force-push the rewritten branch
      pull-requests: write  # update the PR
    concurrency:
      group: dependabot-rewrite-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check GPG availability
        id: gate
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            {
              echo "## Dependabot rewrite: skipped"
              echo ""
              echo "GPG_PRIVATE_KEY and/or GPG_PASSPHRASE are not configured. "
              echo "The Dependabot PR ships with bot-authored, web-signed commits."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GPG secrets unset; leaving Dependabot commits as-is"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted code
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Checkout PR head branch
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # A push made with the workflow token starts no workflow, so the
          # rewritten head would never run CI.
          token: ${{ secrets.AUTO_MERGE_PAT || github.token }}
          persist-credentials: true

      - name: Configure GPG and git identity from the imported key
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          UID_LINE=$(gpg --list-keys --with-colons "$KEY_ID" | awk -F: '/^uid/{print $10; exit}')
          NAME="${UID_LINE%% <*}"
          EMAIL=$(printf '%s' "$UID_LINE" | sed -nE 's/.*<([^>]+)>.*/\1/p')
          git config user.name  "$NAME"
          git config user.email "$EMAIL"
          git config user.signingkey "$KEY_ID"
          git config commit.gpgsign true

      - name: Rewrite commits with scope-aware messages
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
          # The script comes from the trusted checkout of main, never from
          # the pull request branch it rewrites, so the signing key never
          # meets pull request code.
          git rebase "$BASE_SHA" \
            --exec "python3 $GITHUB_WORKSPACE/trusted/scripts/rewrite_dependabot_commit.py"

      - name: Force-push rewritten branch
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git push --force-with-lease origin "HEAD:$HEAD_REF"

      - name: Retitle the pull request after its commits
        # The title Dependabot chose carries its own type, which the
        # rewrite may have changed (a runtime bump becomes fix(deps)).
        # The title goes through the REST API: `gh pr edit` needs a
        # token scope the workflow token does not have.
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          TITLE=$(python3 "$GITHUB_WORKSPACE/trusted/scripts/rewrite_dependabot_commit.py" \
            title "origin/$BASE_REF..HEAD")
          if [ "$TITLE" != "$PR_TITLE" ]; then
            gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --method PATCH --field title="$TITLE"
          fi

      - name: Write step summary
        if: steps.gate.outputs.skip != 'true' && success()
        working-directory: pr
        run: |
          {
            echo "## Dependabot rewrite: applied"
            echo ""
            echo "PR branch \`${{ github.event.pull_request.head.ref }}\` rewritten:"
            echo ""
            echo "- Conventional-commits scope inferred from changed files / dev-group membership"
            echo "- Authored and GPG-signed as \`$(git config user.name) <$(git config user.email)>\`"
          } >> "$GITHUB_STEP_SUMMARY"
