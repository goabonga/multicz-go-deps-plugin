name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.

  - type: input
    id: version
    attributes:
      label: multicz-go-deps-plugin version
      description: "Output of `pip show multicz-go-deps-plugin`."
    validations:
      required: true

  - type: input
    id: multicz
    attributes:
      label: multicz version
      description: "Output of `multicz --version`."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: >
        How can we reproduce this issue? Include the relevant
        `[plugins.go-deps]` section of multicz.toml and the `go` error, if any.
      placeholder: |
        1. Run `multicz validate`
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include the output.
    validations:
      required: true
