[project]
name = "multicz-go-deps-plugin"
version = "0.4.0"
description = "multicz plugin that claims Go components via go list -deps instead of hand-maintained paths globs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["multicz", "plugin", "go", "versioning", "monorepo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "multicz>=1.8,<2",
]

[project.entry-points."multicz.plugins"]
go-deps = "multicz_go_deps:GoDepsPlugin"

[project.urls]
Homepage = "https://github.com/goabonga/multicz-go-deps-plugin"
Repository = "https://github.com/goabonga/multicz-go-deps-plugin"
Issues = "https://github.com/goabonga/multicz-go-deps-plugin/issues"
Changelog = "https://github.com/goabonga/multicz-go-deps-plugin/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multicz_go_deps"]

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.8",
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=4",
    "pyright>=1.1.414",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/multicz_go_deps"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501 (line length) is enforced by the formatter, not the linter: fixtures,
# message templates and the job-summary tables legitimately run past 100 columns.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# The plugin's only subprocess call shells out to the `go` CLI with a
# fixed, non-shell argument list and no untrusted input (B404/B603:
# legitimate subprocess use, shell=False; B607: "go" is intentionally
# resolved via PATH so the plugin works with any Go toolchain install).
[tool.bandit]
skips = ["B404", "B603", "B607"]

# pyright checks the public src/ as a second opinion next to mypy: the two
# checkers disagree on inference and narrowing.
[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
